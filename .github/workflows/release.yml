name: Release APK

# Tag a commit to ship it:
#   git tag v1.0.1 && git push origin v1.0.1
# The tag is the version the app reports and compares against, so it is the one
# place a release's version number is written.
on:
  push:
    tags: ["v*"]
  # Lets you re-run a build from the Actions tab without moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.1)"
        required: true

permissions:
  contents: write # required to create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from the tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the leading v: 1.0.1 is what pubspec and the app compare on.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Deliberately not actions/setup-java: the runner image already ships
      # Temurin 17, so downloading that action bought nothing and was a real
      # failure point — codeload returned 503/429/503 for its tarball on the
      # first two attempts at this release. Gradle needs 17 specifically, hence
      # the explicit JAVA_HOME rather than whatever `java` happens to be.
      - name: Point Gradle at the preinstalled JDK 17
        run: |
          if [ -z "$JAVA_HOME_17_X64" ]; then
            echo "::error::No preinstalled JDK 17 on this runner image." \
                 "Pin one with actions/setup-java if the image ever drops it."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — see SETUP.md." \
                 "Without it the APK would be signed with a throwaway debug key" \
                 "and could not install over an existing Momentum."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/momentum.jks"

      - name: Build the release APK
        env:
          MOMENTUM_KEYSTORE: ${{ runner.temp }}/momentum.jks
          MOMENTUM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOMENTUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOMENTUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.name }}" \
            --dart-define=UPDATE_REPO="${{ github.repository }}"

      - name: Name the APK after its version
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "momentum-${{ steps.version.outputs.name }}.apk"

      # `gh` ships on the runner, so this needs no third-party action.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: momentum-${{ steps.version.outputs.name }}.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Momentum ${{ steps.version.outputs.name }}" \
              --generate-notes
          fi

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/momentum.jks"
