org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_timezone 2.1.0 and workmanager 0.5.2 still declare Kotlin jvmTarget
# 1.8 while AGP compiles their Java at 11+. Gradle treats the mismatch as an
# error by default; 1.8 bytecode on a higher Java target is the safe direction,
# and everything is dexed anyway. Drop this once those plugins are upgraded.
kotlin.jvm.target.validation.mode=warning
